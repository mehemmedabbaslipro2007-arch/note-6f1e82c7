<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>bir təklifim var... 🌸</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- üzən ləçəklər / bəzək fonu -->
  <div class="floaties" id="floaties" aria-hidden="true"></div>

  <main class="card" id="card">
    <div class="card-glow" aria-hidden="true"></div>

    <div class="sparkle sparkle-tl" aria-hidden="true">✨</div>
    <div class="sparkle sparkle-br" aria-hidden="true">✨</div>

    <div class="stage" id="bunnyStage">
      <img class="bunny-face active" id="face-ask" src="assets/bunny-ask.png" alt="dovşan - soruşur">
      <img class="bunny-face" id="face-shy" src="assets/bunny-shy.png" alt="dovşan - utancaq">
      <img class="bunny-face" id="face-annoyed" src="assets/bunny-annoyed.png" alt="dovşan - əsəbi">
      <img class="bunny-face" id="face-sad" src="assets/bunny-sad.png" alt="dovşan - kövrək">
      <img class="bunny-face" id="face-pleading" src="assets/bunny-pleading.png" alt="dovşan - yalvarır">
      <img class="bunny-face" id="face-tired" src="assets/bunny-tired.png" alt="dovşan - laqeyd">
      <img class="bunny-face" id="face-questioning" src="assets/bunny-questioning.png" alt="dovşan - sual dolu">
      <img class="bunny-face" id="face-joy" src="assets/bunny-joy.png" alt="dovşan - sevincli">

      <!-- pion buketi - sənin göndərdiyin əsl foto, fonu təmizlənib (feather-mask) overlay kimi -->
      <img class="bouquet offer" id="bouquet" src="assets/bouquet-1-cutout.png" alt="pion buketi">
    </div>

    <p class="question" id="question">Bu gülləri qəbul edirsənmi? 🌸</p>
    <p class="datetime-badge" id="datetimeBadge">🌷 sənin üçün toplanıb</p>
    <p class="subtext" id="subtext">bir cavabın var, elə deyilmi? 🐇</p>

    <div class="btn-row" id="btnRow">
      <button class="btn btn-yes" id="yesBtn" type="button">BƏLİ</button>
      <button class="btn btn-no" id="noBtn" type="button">XEYR</button>
    </div>
  </main>

  <canvas id="fx" aria-hidden="true"></canvas>

  <script src="script.js"></script>
</body>
</html>
